<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 30" width="800" height="30" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .l1 { stroke-dasharray: 320; animation: desenha 7s ease-in-out infinite; }
    .l2 { stroke-dasharray: 320; animation: desenha 7s ease-in-out .25s infinite; }
    @keyframes desenha {
      0%   { stroke-dashoffset: 320; opacity: 1; }
      35%  { stroke-dashoffset: 0; opacity: 1; }
      85%  { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
    .luzE { animation: corre-e 7s ease-in-out infinite; }
    .luzD { animation: corre-d 7s ease-in-out infinite; }
    @keyframes corre-e { 0% { transform: translateX(0); opacity: 0; } 5% { opacity: 1; } 35% { transform: translateX(-320px); opacity: 1; } 42%,100% { transform: translateX(-320px); opacity: 0; } }
    @keyframes corre-d { 0% { transform: translateX(0); opacity: 0; } 5% { opacity: 1; } 35% { transform: translateX(320px); opacity: 1; } 42%,100% { transform: translateX(320px); opacity: 0; } }
    .gema { transform-box: fill-box; transform-origin: center; animation: gema 3s ease-in-out infinite; }
    @keyframes gema { 0%,100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.3) rotate(8deg); } }
    .halo { animation: halo 3s ease-in-out infinite; }
    @keyframes halo { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
    .p1 { animation: pisca 2.4s ease-in-out infinite; }
    .p2 { animation: pisca 2.4s ease-in-out 1.2s infinite; }
    @keyframes pisca { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <filter id="b"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <path class="l1" d="M340 15 H20" stroke="#7a1626" stroke-width="1.5" fill="none"/>
  <path class="l1" d="M460 15 H780" stroke="#7a1626" stroke-width="1.5" fill="none"/>
  <path class="l2" d="M340 19 H20" stroke="#c9bda5" stroke-opacity=".4" stroke-width="1" fill="none"/>
  <path class="l2" d="M460 19 H780" stroke="#c9bda5" stroke-opacity=".4" stroke-width="1" fill="none"/>

  <circle class="luzE" cx="340" cy="15" r="4" fill="#fff6e0" filter="url(#b)"/>
  <circle class="luzD" cx="460" cy="15" r="4" fill="#fff6e0" filter="url(#b)"/>

  <circle class="p1" cx="360" cy="15" r="3" fill="#7a1626"/>
  <circle class="p2" cx="440" cy="15" r="3" fill="#7a1626"/>

  <circle class="halo" cx="400" cy="15" r="14" fill="#b3141f" filter="url(#b)"/>
  <path class="gema" d="M400 3 l10 12 l-10 12 l-10 -12z" fill="#b3141f"/>
  <path d="M400 8 l5 7 l-5 7 l-5 -7z" fill="#140608"/>
</svg>
