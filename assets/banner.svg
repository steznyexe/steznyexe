<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .damasco { animation: deriva 28s linear infinite; }
    @keyframes deriva { to { transform: translate(60px, 80px); } }

    .renda { animation: marcha 3s linear infinite, respira 5s ease-in-out infinite; }
    @keyframes marcha { to { stroke-dashoffset: -20; } }
    @keyframes respira { 0%,100% { stroke-opacity: .55; } 50% { stroke-opacity: 1; } }

    .vela { animation: tremula 3.4s ease-in-out infinite; }
    .vela.b { animation-delay: -1.7s; animation-duration: 4.1s; }
    @keyframes tremula { 0%,100% { opacity:.45; } 18% { opacity:.8; } 37% { opacity:.5; } 62% { opacity:.9; } 80% { opacity:.55; } }

    .em { opacity: 0; animation-name: sobe; animation-timing-function: ease-in; animation-iteration-count: infinite; }
    @keyframes sobe {
      0%   { transform: translate(0,0); opacity: 0; }
      15%  { opacity: .9; }
      100% { transform: translate(var(--dx), -290px); opacity: 0; }
    }

    .brilho { animation: varre 7s ease-in-out infinite; }
    @keyframes varre { 0% { transform: translateX(-160px); } 55%,100% { transform: translateX(760px); } }

    .aura { animation: pulsa 4s ease-in-out infinite; }
    @keyframes pulsa { 0%,100% { opacity:.25; } 50% { opacity:.85; } }

    .nome { animation: surge 2.4s ease-out both; }
    .sub  { animation: surge 2.4s ease-out .6s both; }
    @keyframes surge { from { opacity:0; } to { opacity:1; } }

    .balanco { transform-origin: 1100px 0px; animation: pendulo 5s ease-in-out infinite; }
    @keyframes pendulo { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }

    .corte { animation: entra 1.6s cubic-bezier(.2,.8,.2,1) both, bate 3.2s ease-in-out 1.6s infinite; }
    .corte.d { animation-name: entraD, bate; }
    @keyframes entra  { from { transform: translateX(-160px); opacity:0; } to { transform: none; opacity:.85; } }
    @keyframes entraD { from { transform: translateX(160px);  opacity:0; } to { transform: none; opacity:.85; } }
    @keyframes bate   { 0%,100% { opacity:.85; } 50% { opacity:.45; } }

    .losango { transform-box: fill-box; transform-origin: center; animation: gira 6s ease-in-out infinite; }
    @keyframes gira { 0%,100% { transform: scale(1); } 50% { transform: scale(1.35); } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1; } .em { opacity: 0; } }
  </style>

  <defs>
    <pattern id="damasco" width="60" height="80" patternUnits="userSpaceOnUse">
      <ellipse cx="30" cy="40" rx="14" ry="26" fill="none" stroke="#7a1626" stroke-opacity=".4" stroke-width="1.5"/>
      <path d="M30 18 L37 40 L30 62 L23 40Z" fill="#7a1626" fill-opacity=".3"/>
      <circle cx="0" cy="0" r="5" fill="#7a1626" fill-opacity=".25"/>
      <circle cx="60" cy="0" r="5" fill="#7a1626" fill-opacity=".25"/>
      <circle cx="0" cy="80" r="5" fill="#7a1626" fill-opacity=".25"/>
      <circle cx="60" cy="80" r="5" fill="#7a1626" fill-opacity=".25"/>
    </pattern>
    <radialGradient id="vinheta" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity=".75"/>
    </radialGradient>
    <radialGradient id="chama" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b3141f" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#b3141f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="luz" x1="0" x2="1">
      <stop offset="0" stop-color="#fff6e0" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff6e0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff6e0" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="painel"><rect x="300" y="64" width="600" height="192" rx="26"/></clipPath>
  </defs>

  <rect width="1200" height="320" fill="#140608"/>
  <rect class="damasco" x="-60" y="-80" width="1320" height="480" fill="url(#damasco)"/>

  <!-- luz de vela nos cantos -->
  <circle class="vela" cx="90" cy="250" r="190" fill="url(#chama)"/>
  <circle class="vela b" cx="1110" cy="80" r="190" fill="url(#chama)"/>
  <rect width="1200" height="320" fill="url(#vinheta)"/>

  <!-- brasas subindo -->
  <g>
    <circle class="em" cx="723" cy="300" r="3.1" fill="#b3141f" style="--dx:18px;animation-duration:8.0s;animation-delay:-0.5s"/>
    <circle class="em" cx="808" cy="300" r="2.4" fill="#7a1626" style="--dx:-39px;animation-duration:10.5s;animation-delay:-2.1s"/>
    <circle class="em" cx="916" cy="300" r="1.5" fill="#b3141f" style="--dx:22px;animation-duration:6.5s;animation-delay:-4.2s"/>
    <circle class="em" cx="517" cy="300" r="2.5" fill="#7a1626" style="--dx:24px;animation-duration:8.9s;animation-delay:-0.6s"/>
    <circle class="em" cx="161" cy="300" r="3.2" fill="#7a1626" style="--dx:-13px;animation-duration:6.2s;animation-delay:-8.6s"/>
    <circle class="em" cx="355" cy="300" r="2.4" fill="#b3141f" style="--dx:37px;animation-duration:8.9s;animation-delay:-5.6s"/>
    <circle class="em" cx="271" cy="300" r="2.4" fill="#b3141f" style="--dx:20px;animation-duration:9.2s;animation-delay:-3.7s"/>
    <circle class="em" cx="182" cy="300" r="2.5" fill="#e8dcc4" style="--dx:49px;animation-duration:8.5s;animation-delay:-5.3s"/>
    <circle class="em" cx="1013" cy="300" r="2.5" fill="#b3141f" style="--dx:-27px;animation-duration:8.3s;animation-delay:-3.0s"/>
    <circle class="em" cx="227" cy="300" r="2.4" fill="#7a1626" style="--dx:43px;animation-duration:8.6s;animation-delay:-8.8s"/>
    <circle class="em" cx="649" cy="300" r="2.5" fill="#e8dcc4" style="--dx:-29px;animation-duration:6.4s;animation-delay:-5.1s"/>
    <circle class="em" cx="371" cy="300" r="3.1" fill="#e8dcc4" style="--dx:-41px;animation-duration:8.1s;animation-delay:-9.6s"/>
    <circle class="em" cx="756" cy="300" r="2.7" fill="#b3141f" style="--dx:8px;animation-duration:9.0s;animation-delay:-5.8s"/>
    <circle class="em" cx="251" cy="300" r="3.1" fill="#e8dcc4" style="--dx:-43px;animation-duration:8.4s;animation-delay:-6.6s"/>
    <circle class="em" cx="972" cy="300" r="1.9" fill="#7a1626" style="--dx:-48px;animation-duration:7.9s;animation-delay:-6.7s"/>
    <circle class="em" cx="787" cy="300" r="1.7" fill="#e8dcc4" style="--dx:48px;animation-duration:6.6s;animation-delay:-0.6s"/>
    <circle class="em" cx="324" cy="300" r="2.7" fill="#b3141f" style="--dx:13px;animation-duration:8.0s;animation-delay:-9.2s"/>
    <circle class="em" cx="400" cy="300" r="2.2" fill="#e8dcc4" style="--dx:5px;animation-duration:8.7s;animation-delay:-8.8s"/>
  </g>

  <!-- moldura de renda (bolinhas que caminham) -->
  <rect class="renda" x="14" y="14" width="1172" height="292" rx="10" fill="none" stroke="#6b1424" stroke-width="14" stroke-linecap="round" stroke-dasharray="0 20"/>
  <rect x="32" y="32" width="1136" height="256" fill="none" stroke="#c9bda5" stroke-opacity=".6" stroke-width="1.5"/>
  <rect x="38" y="38" width="1124" height="244" fill="none" stroke="#c9bda5" stroke-opacity=".35" stroke-width="1"/>

  <!-- painel de pergaminho -->
  <rect x="300" y="64" width="600" height="192" rx="26" fill="#d9cfba" stroke="#3a2a22" stroke-width="3"/>
  <rect x="310" y="74" width="580" height="172" rx="20" fill="none" stroke="#8b7a62" stroke-width="1"/>
  <g clip-path="url(#painel)">
    <rect class="brilho" x="300" y="64" width="150" height="192" fill="url(#luz)" transform="skewX(-18)"/>
  </g>

  <path d="M330 160 H470 M730 160 H870" stroke="#7a1626" stroke-width="1.5"/>
  <path class="losango" d="M600 92 l6 8 l-6 8 l-6 -8z" fill="#7a1626"/>
  <path class="losango" style="animation-delay:-3s" d="M600 212 l6 8 l-6 8 l-6 -8z" fill="#7a1626"/>

  <!-- nome com aura vermelha pulsando -->
  <text class="aura" x="600" y="150" text-anchor="middle" font-family="'UnifrakturCook','Palatino Linotype',Georgia,serif" font-size="58" font-weight="700" fill="#b3141f" filter="url(#blur)">STEZNY</text>
  <text class="nome" x="600" y="150" text-anchor="middle" font-family="'UnifrakturCook','Palatino Linotype',Georgia,serif" font-size="58" font-weight="700" fill="#2a1410">STEZNY</text>
  <text class="sub" x="600" y="190" text-anchor="middle" font-family="'Palatino Linotype',Georgia,serif" font-size="20" font-style="italic" letter-spacing="3" fill="#6b1424">arquivo pessoal de código &amp; devaneios</text>

  <!-- medalhão balançando -->
  <g class="balanco">
    <path d="M1100 0 V70" stroke="#c9bda5" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M1100 72 C1086 58 1074 78 1100 98 C1126 78 1114 58 1100 72Z" fill="#c9bda5" stroke="#3a2a22" stroke-width="2"/>
    <path d="M1100 80 C1094 74 1089 82 1100 91 C1111 82 1106 74 1100 80Z" fill="none" stroke="#6b1424" stroke-width="1.5"/>
  </g>

  <!-- cortes vermelhos (estilo arte Arknights) -->
  <path class="corte" d="M0 250 L120 220 L90 250 Z" fill="#b3141f"/>
  <path class="corte d" d="M1200 70 L1080 100 L1110 70 Z" fill="#b3141f"/>
</svg>
