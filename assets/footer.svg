<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .damasco { animation: deriva 28s linear infinite reverse; }
    @keyframes deriva { to { transform: translate(60px, 80px); } }
    .renda { animation: marcha 3s linear infinite, respira 5s ease-in-out infinite; }
    @keyframes marcha { to { stroke-dashoffset: -20; } }
    @keyframes respira { 0%,100% { stroke-opacity:.55; } 50% { stroke-opacity:1; } }
    .vela { animation: tremula 3.4s ease-in-out infinite; }
    @keyframes tremula { 0%,100% { opacity:.45; } 18% { opacity:.85; } 37% { opacity:.5; } 62% { opacity:.95; } 80% { opacity:.55; } }
    .chama { animation: dança 1.6s ease-in-out infinite; }
    @keyframes dança { 0%,100% { transform: scale(1,1) skewX(0); } 25% { transform: scale(.92,1.08) skewX(4deg); } 50% { transform: scale(1.05,.95) skewX(-3deg); } 75% { transform: scale(.95,1.06) skewX(3deg); } }
    .em { opacity:0; animation-name: sobe; animation-timing-function: ease-in; animation-iteration-count: infinite; }
    @keyframes sobe { 0% { transform: translate(0,0); opacity:0; } 15% { opacity:.9; } 100% { transform: translate(var(--dx), -170px); opacity:0; } }
    .brilho { animation: varre 8s ease-in-out infinite; }
    @keyframes varre { 0% { transform: translateX(-160px); } 55%,100% { transform: translateX(760px); } }
    .aura { animation: pulsa 4s ease-in-out infinite; }
    @keyframes pulsa { 0%,100% { opacity:.25; } 50% { opacity:.85; } }
    .texto { animation: surge 2.4s ease-out both; }
    .sub { animation: surge 2.4s ease-out .6s both; }
    @keyframes surge { from { opacity:0; } to { opacity:1; } }
    .losango { transform-box: fill-box; transform-origin: center; animation: gira 6s ease-in-out infinite; }
    @keyframes gira { 0%,100% { transform: scale(1); } 50% { transform: scale(1.35); } }
    .p1 { animation: pisca 2.4s ease-in-out infinite; }
    .p2 { animation: pisca 2.4s ease-in-out 1.2s infinite; }
    @keyframes pisca { 0%,100% { opacity:.3; } 50% { opacity:1; } }
    .corte { animation: bate 3.2s ease-in-out infinite; }
    @keyframes bate { 0%,100% { opacity:.85; } 50% { opacity:.4; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity:1; } .em { opacity:0; } }
  </style>
  <defs>
    <pattern id="damasco" width="60" height="80" patternUnits="userSpaceOnUse">
      <ellipse cx="30" cy="40" rx="14" ry="26" fill="none" stroke="#7a1626" stroke-opacity=".4" stroke-width="1.5"/>
      <path d="M30 18 L37 40 L30 62 L23 40Z" fill="#7a1626" fill-opacity=".3"/>
      <circle cx="0" cy="0" r="5" fill="#7a1626" fill-opacity=".25"/><circle cx="60" cy="0" r="5" fill="#7a1626" fill-opacity=".25"/>
      <circle cx="0" cy="80" r="5" fill="#7a1626" fill-opacity=".25"/><circle cx="60" cy="80" r="5" fill="#7a1626" fill-opacity=".25"/>
    </pattern>
    <radialGradient id="vinheta" cx="50%" cy="50%" r="70%"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".75"/></radialGradient>
    <radialGradient id="chama" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#b3141f" stop-opacity=".6"/><stop offset="100%" stop-color="#b3141f" stop-opacity="0"/></radialGradient>
    <linearGradient id="luz" x1="0" x2="1"><stop offset="0" stop-color="#fff6e0" stop-opacity="0"/><stop offset=".5" stop-color="#fff6e0" stop-opacity=".55"/><stop offset="1" stop-color="#fff6e0" stop-opacity="0"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="painel"><rect x="300" y="36" width="600" height="128" rx="22"/></clipPath>
  </defs>

  <rect width="1200" height="200" fill="#140608"/>
  <rect class="damasco" x="-60" y="-80" width="1320" height="360" fill="url(#damasco)"/>
  <rect width="1200" height="200" fill="url(#vinheta)"/>
  <g>
    <circle class="em" cx="986" cy="185" r="2.6" fill="#b3141f" style="--dx:17px;animation-duration:8.4s;animation-delay:-7.0s"/>
    <circle class="em" cx="438" cy="185" r="2.5" fill="#b3141f" style="--dx:-17px;animation-duration:6.9s;animation-delay:-5.5s"/>
