    <path d="M142 92 q-3 10 0 18" stroke="#d9cfba" stroke-width="3" fill="none"/>
    <rect x="142" y="92" width="16" height="3" fill="#c9bda5"/>
    <line x1="150" y1="92" x2="150" y2="85" stroke="#2a1410" stroke-width="1.5"/>
    <g class="chama" style="animation-delay:-0s;transform-origin:150px 86px">
      <path d="M150 56 C159 68 158 80 150 86 C142 80 141 68 150 56Z" fill="#b3141f"/>
      <path d="M150 66 C154 73 154 79 150 84 C146 79 146 73 150 66Z" fill="#f2d9a0"/>
    </g>
  </g>
  <g>
    <circle class="vela" style="animation-delay:-1.3s" cx="1050" cy="70" r="70" fill="url(#chama)"/>
    <path d="M1028 178 H1072 L1064 168 H1036Z" fill="#3a2a22" stroke="#8b7a62" stroke-width="1.5"/>
    <rect x="1047" y="150" width="6" height="18" fill="#6b4a36"/>
    <ellipse cx="1050" cy="150" rx="14" ry="3.5" fill="#8b7a62"/>
    <rect x="1042" y="92" width="16" height="58" fill="#e8dcc4"/>
    <path d="M1042 92 q-3 10 0 18" stroke="#d9cfba" stroke-width="3" fill="none"/>
    <rect x="1042" y="92" width="16" height="3" fill="#c9bda5"/>
    <line x1="1050" y1="92" x2="1050" y2="85" stroke="#2a1410" stroke-width="1.5"/>
    <g class="chama" style="animation-delay:-1.3s;transform-origin:1050px 86px">
      <path d="M1050 56 C1059 68 1058 80 1050 86 C1042 80 1041 68 1050 56Z" fill="#b3141f"/>
      <path d="M1050 66 C1054 73 1054 79 1050 84 C1046 79 1046 73 1050 66Z" fill="#f2d9a0"/>
    </g>
  </g>

  <rect x="300" y="36" width="600" height="128" rx="22" fill="#d9cfba" stroke="#3a2a22" stroke-width="3"/>
  <rect x="309" y="45" width="582" height="110" rx="16" fill="none" stroke="#8b7a62" stroke-width="1"/>
  <g clip-path="url(#painel)"><rect class="brilho" x="300" y="36" width="150" height="128" fill="url(#luz)" transform="skewX(-18)"/></g>

  <path d="M330 100 H400 M800 100 H870" stroke="#7a1626" stroke-width="1.5"/>
  <circle class="p1" cx="412" cy="100" r="3" fill="#7a1626"/>
  <circle class="p2" cx="788" cy="100" r="3" fill="#7a1626"/>
