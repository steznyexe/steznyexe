  <text class="aura" x="600" y="108" text-anchor="middle" font-family="'UnifrakturCook','Palatino Linotype',Georgia,serif" font-size="40" font-weight="700" fill="#b3141f" filter="url(#blur)">Até a próxima, viajante</text>
  <text class="texto" x="600" y="108" text-anchor="middle" font-family="'UnifrakturCook','Palatino Linotype',Georgia,serif" font-size="40" font-weight="700" fill="#2a1410">Até a próxima, viajante</text>
