    <circle class="em" cx="69" cy="185" r="2.3" fill="#b3141f" style="--dx:30px;animation-duration:6.8s;animation-delay:-2.5s"/>
    <circle class="em" cx="580" cy="185" r="1.8" fill="#b3141f" style="--dx:-32px;animation-duration:5.9s;animation-delay:-2.6s"/>
    <circle class="em" cx="880" cy="185" r="1.5" fill="#b3141f" style="--dx:-38px;animation-duration:6.2s;animation-delay:-0.6s"/>
    <circle class="em" cx="497" cy="185" r="1.6" fill="#7a1626" style="--dx:10px;animation-duration:8.6s;animation-delay:-4.2s"/>
    <circle class="em" cx="209" cy="185" r="2.1" fill="#b3141f" style="--dx:3px;animation-duration:5.8s;animation-delay:-6.1s"/>
    <circle class="em" cx="697" cy="185" r="1.8" fill="#b3141f" style="--dx:-25px;animation-duration:8.9s;animation-delay:-6.8s"/>
    <circle class="em" cx="564" cy="185" r="2.4" fill="#b3141f" style="--dx:22px;animation-duration:5.0s;animation-delay:-4.2s"/>
    <circle class="em" cx="445" cy="185" r="2.0" fill="#7a1626" style="--dx:-24px;animation-duration:5.8s;animation-delay:-6.6s"/>
  </g>

  <rect class="renda" x="14" y="14" width="1172" height="172" rx="10" fill="none" stroke="#6b1424" stroke-width="14" stroke-linecap="round" stroke-dasharray="0 20"/>
  <rect x="32" y="32" width="1136" height="136" fill="none" stroke="#c9bda5" stroke-opacity=".6" stroke-width="1.5"/>
  <rect x="38" y="38" width="1124" height="124" fill="none" stroke="#c9bda5" stroke-opacity=".35" stroke-width="1"/>

